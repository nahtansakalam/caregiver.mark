<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Upload & Save Website</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0d0d0d;
      color:white;
    }

    header{
      background:#111;
      padding:25px;
      text-align:center;
      border-bottom:1px solid #222;
    }

    header h1{
      font-size:40px;
    }

    .container{
      width:90%;
      max-width:1200px;
      margin:auto;
      padding:40px 0;
    }

    .upload-box{
      background:#161616;
      padding:40px;
      border-radius:20px;
      border:1px solid #222;
      text-align:center;
      margin-bottom:40px;
    }

    .upload-box input{
      margin-top:20px;
      padding:10px;
    }

    .video-gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:20px;
    }

    .video-card{
      background:#161616;
      border:1px solid #222;
      border-radius:20px;
      padding:15px;
    }

    .video-card video{
      width:100%;
      border-radius:15px;
    }

    .delete-btn{
      width:100%;
      margin-top:10px;
      padding:12px;
      border:none;
      background:red;
      color:white;
      border-radius:10px;
      cursor:pointer;
    }

    footer{
      text-align:center;
      padding:30px;
      color:#777;
      border-top:1px solid #222;
      margin-top:50px;
    }

  </style>
</head>

<body>

  <header>
    <h1>Saved Video Website</h1>
  </header>

  <div class="container">

    <!-- UPLOAD BOX -->
    <div class="upload-box">

      <h2>Upload Videos</h2>

      <input 
        type="file" 
        id="videoUpload" 
        accept="video/*" 
        multiple
      >

    </div>

    <!-- VIDEO GALLERY -->
    <div class="video-gallery" id="videoGallery"></div>

  </div>

  <footer>
    © 2026 Video Upload Website
  </footer>

  <script>

    const uploadInput = document.getElementById("videoUpload");
    const gallery = document.getElementById("videoGallery");

    // LOAD SAVED VIDEOS
    window.onload = function(){

      const savedVideos = JSON.parse(localStorage.getItem("videos")) || [];

      savedVideos.forEach(videoData => {
        createVideo(videoData);
      });

    };

    // UPLOAD VIDEOS
    uploadInput.addEventListener("change", function(event){

      const files = event.target.files;

      for(let file of files){

        const reader = new FileReader();

        reader.onload = function(e){

          const videoData = e.target.result;

          // SAVE TO LOCAL STORAGE
          let savedVideos = JSON.parse(localStorage.getItem("videos")) || [];

          savedVideos.push(videoData);

          localStorage.setItem("videos", JSON.stringify(savedVideos));

          // SHOW VIDEO
          createVideo(videoData);

        };

        reader.readAsDataURL(file);

      }

    });

    // CREATE VIDEO ELEMENT
    function createVideo(videoSrc){

      const card = document.createElement("div");
      card.classList.add("video-card");

      const video = document.createElement("video");

      video.src = videoSrc;
      video.controls = true;

      // DELETE BUTTON
      const deleteBtn = document.createElement("button");

      deleteBtn.innerText = "Delete Video";
      deleteBtn.classList.add("delete-btn");

      deleteBtn.onclick = function(){

        card.remove();

        let savedVideos = JSON.parse(localStorage.getItem("videos")) || [];

        savedVideos = savedVideos.filter(v => v !== videoSrc);

        localStorage.setItem("videos", JSON.stringify(savedVideos));

      };

      card.appendChild(video);
      card.appendChild(deleteBtn);

      gallery.appendChild(card);

    }

  </script>

</body>
</html>
